<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>webmosh</title>
<link rel="stylesheet" href="xterm.css">
<style>
  /* The defaults. The deployment's custom.css (in the relay's static_dir) comes after these: a font (the terminal uses
     an @font-face "webmosh-mono" first), a background picture. app.mjs sets --bg and --fg from the theme. */
  :root { color-scheme: dark; --bg: #1d1f21; --fg: #c5c8c6; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  html { background: var(--bg); }
  body { display: flex; flex-direction: column; height: 100dvh; }
  /* top and bottom clear the iPad's rounded screen corners (about 18 pt), which would cut off the ends of the tmux
     status line in full screen (Kiosk) */
  #term { flex: 1; min-height: 0; padding: max(18px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #term .xterm { height: 100%; }
  /* a press and drag on the terminal is the page's (app.mjs reports it to tmux), never an iPadOS pan */
  #term { touch-action: none; }
  /* tabs (tabs.mjs): the bar from two tabs on, over the top corners the terminal pads for otherwise; Ghostty-like,
     the active tab lit, the others dim until the pointer finds them (Universal Control) */
  #tabs { display: flex; gap: 4px; flex: none; padding: max(10px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 2px max(22px, env(safe-area-inset-left));
    font: 12px -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  body.has-tabs #term { padding-top: 6px; }
  #tabs .tab { flex: 1 1 0; min-width: 0; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border-radius: 7px; color: rgba(200, 208, 224, .55); cursor: default; transition: background .15s, color .15s; }
  #tabs .tab:hover { background: rgba(255, 255, 255, .05); color: rgba(200, 208, 224, .8); }
  #tabs .tab.active { background: rgba(255, 255, 255, .1); color: var(--fg); }
  #tabs .name { font-weight: 600; white-space: nowrap; }
  #tabs .kind { margin-left: 5px; padding: 0 4px; border-radius: 4px; font: 600 9px/14px -apple-system, system-ui, sans-serif;
    letter-spacing: .04em; text-transform: uppercase; background: rgba(255, 255, 255, .1); opacity: .8; vertical-align: 1px; }
  #tabs .sub { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: .6; }
  #tabs .key { opacity: .45; font-variant-numeric: tabular-nums; }
  #tabs .x { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; font-size: 14px; line-height: 1; visibility: hidden; }
  #tabs .tab:hover .x, #tabs .tab.active .x { visibility: visible; }
  #tabs .x:hover { background: rgba(255, 255, 255, .12); }
  #tabs .add { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; font-size: 17px; color: rgba(200, 208, 224, .55); }
  #tabs .add:hover { background: rgba(255, 255, 255, .08); color: var(--fg); }
  /* one tab: a faint + in the bottom-right corner (inside a panel, left of its close button). It and the corner buttons
     below are placed in the body, not the window: on iOS the window's bottom runs on under the on-screen keyboard
     (only the visible area shrinks), while the body follows the visible area (app.mjs), so the + stays above the key row */
  #newtab { position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5;
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .08);
    color: rgba(255, 255, 255, .7); font: 300 20px/1 -apple-system, system-ui, sans-serif; opacity: .3; transition: opacity .2s; user-select: none; -webkit-user-select: none; }
  html.embedded #newtab { right: calc(50px + env(safe-area-inset-right)); }
  #newtab:hover { opacity: 1; }
  /* a touch screen (keyrow.mjs): the keys its keyboard lacks under the terminal while the keyboard is on, else a button
     in the corner (left of the +) to bring the keyboard back; left of either, a paperclip for photos and files */
  #keys { display: flex; gap: 6px; flex: none; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    padding: 4px max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #keys .strip { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent); }
  #keys .strip::-webkit-scrollbar { display: none; }
  #keys button { flex: 1 0 auto; min-width: 34px; max-width: 64px; height: 36px; padding: 0 7px; border: 0; border-radius: 7px;
    background: rgba(255, 255, 255, .09); color: var(--fg); font: 500 14px -apple-system, system-ui, sans-serif;
    display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  #keys button:active { background: rgba(255, 255, 255, .2); }
  #keys button.held { background: var(--fg); color: var(--bg); }
  #keys .away, #keys .attach { flex: none; width: 44px; color: rgba(200, 208, 224, .7); }
  body.has-keys #term { padding-bottom: 4px; }
  body.kb-up #keys { padding-bottom: 6px; } /* the keyboard is below: no home indicator to clear */
  body.has-keys #newtab { bottom: calc(56px + env(safe-area-inset-bottom)); }
  body.has-keys.kb-up #newtab { bottom: 56px; }
  #kbtoggle, #attach { position: absolute; right: calc(50px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5;
    width: 32px; height: 32px; padding: 0; border: 0; display: grid; place-items: center; border-radius: 50%;
    background: rgba(255, 255, 255, .1); color: rgba(255, 255, 255, .8); opacity: .5; -webkit-tap-highlight-color: transparent; }
  html.embedded #kbtoggle { right: calc(90px + env(safe-area-inset-right)); }
  body.has-tabs #kbtoggle { right: calc(10px + env(safe-area-inset-right)); }
  html.embedded body.has-tabs #kbtoggle { right: calc(50px + env(safe-area-inset-right)); }
  #attach { right: calc(90px + env(safe-area-inset-right)); }
  html.embedded #attach { right: calc(130px + env(safe-area-inset-right)); }
  body.has-tabs #attach { right: calc(50px + env(safe-area-inset-right)); }
  html.embedded body.has-tabs #attach { right: calc(90px + env(safe-area-inset-right)); }
  /* the hosts page (hosts.mjs): a card over the terminal, the whole screen on a phone */
  #hosts { position: fixed; inset: 0; z-index: 20; display: grid; place-items: start center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); }
  #hosts .card { width: 100%; max-width: 720px; box-sizing: border-box; padding: 18px 20px 20px; border-radius: 14px; outline: none;
    background: var(--bg); border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 24px 64px rgba(0, 0, 0, .5); }
  #hosts .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #hosts h2 { margin: 0; font-size: 17px; font-weight: 650; }
  #hosts .sub { margin-top: 2px; opacity: .6; }
  #hosts h3 { margin: 20px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .5; }
  #hosts .status:not(:empty) { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(224, 100, 90, .15); color: #f2a59d; overflow-wrap: anywhere; }
  #hosts .row { padding: 11px 0; border-top: 1px solid rgba(255, 255, 255, .07); }
  #hosts .top { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
  #hosts .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #hosts .name b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hosts .badge { padding: 0 5px; border-radius: 4px; font: 600 10px/16px -apple-system, system-ui, sans-serif; background: #d9a33b; color: #1d1f21; }
  #hosts .state { display: flex; align-items: center; gap: 6px; white-space: nowrap; opacity: .75; }
  #hosts .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
  #hosts .dot.ok { background: #6cc070; }
  #hosts .dot.warn { background: #d9a33b; }
  #hosts .dot.bad { background: #e0645a; }
  #hosts .dot.info { background: #5aa0e0; }
  #hosts .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  #hosts .meta { margin-top: 3px; opacity: .65; overflow-wrap: anywhere; }
  #hosts .meta b { font-weight: 600; }
  #hosts code { font: 12px "webmosh-mono", ui-monospace, Menlo, monospace; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, .08); }
  #hosts .err { margin-top: 6px; color: #f2a59d; overflow-wrap: anywhere; }
  #hosts .cmd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #hosts .cmd code { flex: 1 1 260px; display: block; padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
  #hosts .until { font-size: 12px; opacity: .55; }
  #hosts .note { margin: 6px 0 0; font-size: 12px; opacity: .6; }
  #hosts .foot { margin-top: 20px; }
  #hosts .notice { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .06); }
  #hosts .notice p { margin: 0; }
  #hosts .notice > .btn { margin-top: 8px; }
  #hosts .edit { margin-top: 10px; padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, .04); }
  #hosts .fields { display: grid; grid-template-columns: 1fr 1.4fr 96px; gap: 10px; }
  #hosts label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; opacity: .85; }
  /* 16px: iOS zooms the page into a smaller input */
  #hosts input { min-width: 0; padding: 6px 8px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .07);
    color: var(--fg); font: 16px -apple-system, system-ui, sans-serif; }
  #hosts input:focus { outline: none; border-color: rgba(255, 255, 255, .4); }
  #hosts .edit .acts { margin: 10px 0 0; justify-content: flex-start; }
  #hosts .btn { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: rgba(255, 255, 255, .1); color: var(--fg);
    font: 500 13px -apple-system, system-ui, sans-serif; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #hosts .btn:hover { background: rgba(255, 255, 255, .16); }
  #hosts .btn.primary { background: var(--fg); color: var(--bg); }
  #hosts .btn.primary:hover { opacity: .88; }
  #hosts .btn.ghost { background: transparent; }
  #hosts .btn.ghost:hover { background: rgba(255, 255, 255, .1); }
  #hosts .btn.danger { background: #c9473d; color: #fff; }
  #hosts .btn:disabled { opacity: .45; cursor: default; }
  #hosts .close { width: 32px; padding: 0; font-size: 22px; font-weight: 300; line-height: 1; }
  #hosts .more { width: 30px; padding: 0; display: grid; place-items: center; }
  #hosts .more svg { width: 16px; height: 16px; transition: transform .15s; }
  #hosts .more.open svg { transform: rotate(180deg); }
  #hosts .gone .row { opacity: .6; }
  #hosts .fields.two { grid-template-columns: 1.6fr 1fr; }
  #hosts label.address { grid-column: 1 / -1; }
  @media (max-width: 600px) {
    #hosts { padding: 0; place-items: stretch; }
    #hosts .card { max-width: none; min-height: 100%; border: 0; border-radius: 0;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    #hosts .fields, #hosts .fields.two { grid-template-columns: 1fr; }
  }
  [hidden] { display: none !important; }
  .wm-hide-comp .xterm .composition-view { display: none !important; }
</style>
<link rel="stylesheet" href="custom.css">
</head>
<body>
<main id="term"></main>
<script type="module" src="app.js"></script>
</body>
</html>
